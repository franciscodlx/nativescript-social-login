name: CI

# Pull requests only. main takes changes through merged pull requests alone
# (ruleset: PR required, these checks must pass), so the merged code already
# passed here; release.yml publishes it without running the suite again.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Mocks and example backends
        run: for dir in tools/*/; do (cd "$dir" && node --test) || exit 1; done
      - run: pnpm --filter @franciscodlxdev/nativescript-social-login-demo typecheck
      - name: Packages publish cleanly (dry run)
        run: node scripts/release.mjs --dry-run

  android:
    name: Demo (Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build
        working-directory: examples/demo
        run: pnpm exec ns build android

  ios:
    name: Demo (iOS)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build
        working-directory: examples/demo
        run: pnpm exec ns build ios
